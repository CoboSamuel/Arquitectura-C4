openapi: 3.1.0
info:
  title: Sistema Web SRI ANT API
  version: 1.0.0
  description: >-
    Contrato versionado para consultas. Las consultas de contribuyentes y
    vehículos integran el SRI; la consulta de licencias conserva el contrato
    de ANT, usa un proveedor simulado por defecto mientras el sitio externo
    está caído y usa Redis Cloud para conservar el último resumen válido.
servers:
  - url: http://localhost:8080
paths:
  /api/v1/consultas/contribuyentes:
    post:
      operationId: consultarContribuyente
      summary: Consultar un contribuyente por RUC
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsultaContribuyenteRequest'
      responses:
        '200':
          description: Contribuyente verificado como persona natural.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultaContribuyenteResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/ContributorNotFound'
        '422':
          $ref: '#/components/responses/NotNaturalPerson'
        '502':
          $ref: '#/components/responses/InvalidSriResponse'
        '503':
          $ref: '#/components/responses/SriUnavailable'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/consultas/vehiculos:
    post:
      operationId: consultarVehiculo
      summary: Consultar un vehículo por placa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsultaVehiculoRequest'
      responses:
        '200':
          description: Resumen vehicular con campos permitidos del registro consultado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultaVehiculoResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/VehicleNotFound'
        '502':
          $ref: '#/components/responses/InvalidSriResponse'
        '503':
          $ref: '#/components/responses/SriUnavailable'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/consultas/licencias:
    post:
      operationId: consultarLicencia
      summary: Consultar puntos de licencia por cédula y placa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsultaLicenciaRequest'
      responses:
        '200':
          description: Puntos de licencia obtenidos del proveedor ANT simulado o real, o del último dato válido en caché.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultaLicenciaResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/LicenseNotFound'
        '502':
          $ref: '#/components/responses/InvalidAntResponse'
        '503':
          $ref: '#/components/responses/LicenseUnavailable'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  schemas:
    ConsultaContribuyenteRequest:
      type: object
      additionalProperties: false
      required: [correo, ruc]
      properties:
        correo:
          type: string
          format: email
          maxLength: 254
        ruc:
          type: string
          pattern: '^[0-9]{13}$'
          description: Trece dígitos; el SRI confirma existencia y tipo de persona.
    ConsultaContribuyenteResponse:
      type: object
      additionalProperties: false
      required:
        - ruc
        - nombre
        - tipoContribuyente
        - estado
        - actividadEconomicaPrincipal
        - regimen
        - fechaInicioActividades
      properties:
        ruc:
          type: string
          pattern: '^[0-9]{13}$'
        nombre:
          type: string
        tipoContribuyente:
          type: string
          const: PERSONA NATURAL
        estado:
          type: string
        actividadEconomicaPrincipal:
          type: string
        regimen:
          type: string
        fechaInicioActividades:
          anyOf:
            - type: string
            - type: 'null'
    ConsultaVehiculoRequest:
      type: object
      additionalProperties: false
      required: [placa]
      properties:
        placa:
          type: string
          pattern: '^[A-Za-z0-9-]{5,8}$'
    ConsultaVehiculoResponse:
      type: object
      additionalProperties: false
      description: Resumen local allowlisted basado en la respuesta del SRI; no incluye identificadores del titular.
      required: [placa, marca, modelo, anioModelo, claseVehiculo]
      properties:
        placa:
          type: string
          pattern: '^[A-Za-z0-9-]{5,8}$'
        marca:
          type: string
        modelo:
          type: string
        anioModelo:
          type: string
        claseVehiculo:
          type: string
        color:
          anyOf:
            - type: string
            - type: 'null'
        cilindraje:
          anyOf:
            - type: string
            - type: 'null'
    ConsultaLicenciaRequest:
      type: object
      additionalProperties: false
      required: [cedula, placa]
      properties:
        cedula:
          type: string
          pattern: '^[0-9]{10}$'
          description: Diez dígitos; este patrón verifica formato, no identidad.
        placa:
          type: string
          pattern: '^[A-Za-z0-9-]{5,8}$'
    ConsultaLicenciaResponse:
      type: object
      additionalProperties: false
      required: [puntosDisponibles, actualizadoEn, origen, desactualizado]
      properties:
        puntosDisponibles:
          type: number
          minimum: 0
          description: Resumen allowlisted; nunca incluye datos personales.
        actualizadoEn:
          type: string
          format: date-time
        origen:
          type: string
          enum: [ANT, SIMULADO, CACHE]
          description: ANT es la fuente real, SIMULADO mantiene el contrato durante la indisponibilidad del sitio y CACHE es el último dato válido retenido.
        desactualizado:
          type: boolean
          description: True cuando se entregó el último resumen cacheado tras un fallo ANT.
    ApiErrorResponse:
      type: object
      required: [status, code, message, fieldErrors]
      properties:
        status:
          type: integer
          example: 400
        code:
          type: string
          example: VALIDATION_ERROR
          description: >-
            Código estable: VALIDATION_ERROR, INVALID_JSON, INTEGRACION_PENDIENTE,
            INTERNAL_ERROR, METHOD_NOT_ALLOWED, UNSUPPORTED_MEDIA_TYPE,
            CONTRIBUYENTE_NO_ENCONTRADO, NO_ES_PERSONA_NATURAL,
            VEHICULO_NO_ENCONTRADO, SRI_NO_DISPONIBLE, SRI_RESPUESTA_INVALIDA,
            LICENCIA_NO_ENCONTRADA, ANT_RESPUESTA_INVALIDA, ANT_NO_DISPONIBLE
            o CACHE_NO_CONFIGURADA.
        message:
          type: string
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/ApiFieldError'
    ApiFieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          example: ruc
        message:
          type: string
  responses:
    ValidationError:
      description: Campo inválido, JSON malformado o propiedad desconocida.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          examples:
            invalidFields:
              summary: Falló la validación de campos
              value:
                status: 400
                code: VALIDATION_ERROR
                message: La solicitud contiene campos inválidos.
                fieldErrors:
                  - field: ruc
                    message: El RUC debe contener exactamente 13 dígitos.
            invalidJson:
              summary: JSON malformado o incompatible
              value:
                status: 400
                code: INVALID_JSON
                message: El cuerpo debe ser JSON válido y compatible con la solicitud.
                fieldErrors: []
    MethodNotAllowed:
      description: El método HTTP no está permitido para esta ruta.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    NotAcceptable:
      description: >-
        La cabecera Accept no admite la representación JSON ofrecida por el API;
        no se devuelve cuerpo porque no existe una representación aceptable.
    UnsupportedMediaType:
      description: El cuerpo debe usar un tipo de contenido admitido, como application/json.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    IntegrationPending:
      description: Solicitud válida, pero la integración externa aún no está implementada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    ContributorNotFound:
      description: El SRI no encontró el RUC o no devolvió un detalle.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    VehicleNotFound:
      description: El SRI no devolvió un vehículo para la placa consultada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    LicenseNotFound:
      description: ANT confirmó que no se encontró una licencia para la consulta.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    InvalidAntResponse:
      description: ANT devolvió HTML que no pudo validarse como un resumen de puntos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    AntUnavailable:
      description: ANT no respondió y no había un valor válido retenido en Redis Cloud.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    LicenseUnavailable:
      description: ANT no respondió sin caché utilizable, o falta configurar la clave segura de caché.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    NotNaturalPerson:
      description: El RUC corresponde a un contribuyente que no es persona natural.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    InvalidSriResponse:
      description: El SRI devolvió una respuesta inválida o inesperada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    SriUnavailable:
      description: El SRI no respondió o limitó temporalmente la consulta.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    InternalError:
      description: Error interno con mensaje genérico y sin detalles de la excepción.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
