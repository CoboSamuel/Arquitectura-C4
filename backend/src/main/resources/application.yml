spring:
  profiles:
    default: live
  application:
    name: sri-ant-backend
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

server:
  port: ${SERVER_PORT:8080}

integrations:
  sri:
    base-url: ${SRI_BASE_URL:https://srienlinea.sri.gob.ec}
    exists-path: ${SRI_EXISTS_PATH:/sri-catastro-sujeto-servicio-internet/rest/ConsolidadoContribuyente/existePorNumeroRuc}
    details-path: ${SRI_DETAILS_PATH:/sri-catastro-sujeto-servicio-internet/rest/ConsolidadoContribuyente/obtenerPorNumerosRuc}
    vehicle-path: ${SRI_VEHICLE_PATH:/sri-matriculacion-vehicular-recaudacion-servicio-internet/rest/BaseVehiculo/obtenerPorNumeroPlacaOPorNumeroCampvOPorNumeroCpn}
    connect-timeout: ${SRI_CONNECT_TIMEOUT:3s}
    read-timeout: ${SRI_READ_TIMEOUT:8s}
  ant:
    base-url: ${ANT_BASE_URL:https://consultaweb.ant.gob.ec}
    path: ${ANT_PATH:/PortalWEB/paginas/clientes/clp_grid_citaciones.jsp}
    connect-timeout: ${ANT_CONNECT_TIMEOUT:3s}
    read-timeout: ${ANT_READ_TIMEOUT:5s}
    simulation:
      points: ${ANT_SIMULATION_POINTS:30}
      available: ${ANT_SIMULATION_AVAILABLE:true}
    cache:
      freshness: ${ANT_CACHE_FRESHNESS:15m}
      max-stale-ttl: ${ANT_CACHE_MAX_STALE_TTL:7d}
      # Solo para la demo local; en Redis Cloud se debe proporcionar un secreto propio.
      key-secret: ${ANT_CACHE_KEY_SECRET:local-development-secret-for-ant-simulation-only}
